# 🧠 Noa 全局静态结构连接组
#Noagent/dna/known_nodes.yaml
# 全局根节点字典，声明当前主干网络中所有合法的、可识别的脑区集群
nodes:
  # 【丘脑网关】的身份人格标识
  sensory_gateway:
    # 物理寻址：当前运行在本地回环地址（在跨设备部署时可改为物理局域网 IP）
    host: "127.0.0.1"
    # 专属轴突端口：丘脑对外广播原始外部刺激（stimulus.raw）的 TCP 端口
    pub_port: 22001

  # 【前额叶皮层】的身份人格标识  
  frontal_lobe:
    # 物理寻址：本地运行
    host: "127.0.0.1"
    # 专属轴突端口：前额叶对外广播认知决策和高级路由指令的 TCP 端口
    pub_port: 22002

  # 【运动皮层】的身份人格标识
  effector:
    # 物理寻址：本地运行
    host: "127.0.0.1"
    # 专属轴突端口：执行器对外广播物理动作执行状态或系统塑性反馈的 TCP 端口
    pub_port: 22003

  #韦尼克区：负责语音转文字
  wernicke_area:
    host: "127.0.0.1"
    pub_port: 22004
